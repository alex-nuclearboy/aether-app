{% load static i18n %}

<header class="site-header">
    <a class="site-brand" href="{% url 'home' %}">
        <img
            class="site-brand__icon"
            src="{% static 'images/aether_logo.png' %}"
            alt=""
            width="32"
            height="32"
        >
        <span class="site-brand__name">Aether</span>
    </a>
    <nav class="site-navigation" aria-label="{% trans 'Account' %}">
        {% if user.is_authenticated %}
        <a class="button button--quiet site-navigation__action" href="{% url 'profile' %}">
            {% trans "My profile" %}
        </a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="button button--quiet site-navigation__action" type="submit">
                {% trans "Sign out" %}
            </button>
        </form>
        {% else %}
        <a class="button button--quiet site-navigation__action" href="{% url 'login' %}">
            {% trans "Sign in" %}
        </a>
        <a class="button button--quiet site-navigation__action" href="{% url 'register' %}">
            {% trans "Sign up" %}
        </a>
        {% endif %}
    </nav>
    <form class="site-language-form" method="post" action="{% url 'set_language' %}">
        {% csrf_token %}
        {% get_current_language as CURRENT_LANGUAGE %}
        {% get_available_languages as AVAILABLE_LANGUAGES %}
        <label class="site-language-form__label" for="site-language">
            {% trans "Language (changes immediately)" %}
        </label>
        <select
            class="site-language-form__select"
            id="site-language"
            name="language"
        >
            {% for language_code, language_name in AVAILABLE_LANGUAGES %}
            <option value="{{ language_code }}"{% if language_code == CURRENT_LANGUAGE %} selected{% endif %}>
                {{ language_name }}
            </option>
            {% endfor %}
        </select>
        <noscript>
            <button class="button button--quiet site-language-form__submit" type="submit">
                {% trans "Apply" %}
            </button>
        </noscript>
    </form>
</header>

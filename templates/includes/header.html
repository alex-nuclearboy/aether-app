{% load static %}

<header class="site-header">
    <a class="site-brand" href="{% url 'home' %}">
        <img
            class="site-brand__icon"
            src="{% static 'images/aether_logo.png' %}"
            alt=""
            width="32"
            height="32"
        >
        <span class="site-brand__name">Aether</span>
    </a>
    <nav class="site-navigation" aria-label="Account">
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="site-navigation__action" type="submit">
                Sign out
            </button>
        </form>
        {% else %}
        <a class="site-navigation__action" href="{% url 'login' %}">
            Sign in
        </a>
        {% endif %}
    </nav>
</header>

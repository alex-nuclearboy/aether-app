{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aether{% endblock title %}</title>

    <!-- Favicons -->
    <link rel="icon" href="{% static 'favicons/favicon.ico' %}">
    <link
        rel="icon"
        type="image/png"
        sizes="32x32"
        href="{% static 'favicons/favicon-32x32.png' %}"
    >
    <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="{% static 'favicons/favicon-16x16.png' %}"
    >
    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="{% static 'favicons/apple-touch-icon.png' %}"
    >
    <link
        rel="manifest"
        href="{% static 'favicons/site.webmanifest' %}"
    >

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
    >

    <!-- Shared foundations and layout -->
    <link rel="stylesheet" href="{% static 'css/foundations/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">

    <!-- Shared components -->
    <link rel="stylesheet" href="{% static 'css/components/button.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/form-field.css' %}">
    <link rel="stylesheet" href="{% static 'css/components/header.css' %}">

    <!-- Page-specific styles -->
    {% block page_styles %}{% endblock page_styles %}
</head>
<body>
    {% include "includes/header.html" %}

    <main id="main-content">
        {% block content %}{% endblock content %}
    </main>
</body>
</html>

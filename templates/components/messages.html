{% load i18n %}
{% if messages %}
<div class="flash-messages" aria-label="{% trans 'Notifications' %}">
    {% for message in messages %}
    <div
        class="alert alert--{{ message.level_tag }}"
        role="{% if message.level_tag == 'error' %}alert{% else %}status{% endif %}"
    >
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}

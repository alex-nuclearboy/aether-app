{% load static i18n %}

<header class="site-header">
    <a class="site-brand" href="{% url 'home' %}">
        <img
            class="site-brand__icon"
            src="{% static 'images/aether_logo.png' %}"
            alt=""
            width="32"
            height="32"
        >
        <span class="site-brand__name">Aether</span>
    </a>
    <nav class="site-navigation" aria-label="{% trans 'Account' %}">
        {% if user.is_authenticated %}
        <a class="button button--quiet site-navigation__action" href="{% url 'profile' %}">
            {% trans "My profile" %}
        </a>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="button button--quiet site-navigation__action" type="submit">
                {% trans "Sign out" %}
            </button>
        </form>
        {% else %}
        <a class="button button--quiet site-navigation__action" href="{% url 'login' %}">
            {% trans "Sign in" %}
        </a>
        {% endif %}
    </nav>
</header>
